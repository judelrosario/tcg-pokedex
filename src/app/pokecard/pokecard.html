<div class="pokecard">
    <div class="pokecard__name">
        <span class="pokecard__name__title">Bulbasaur</span>
    </div>
    <div class="pokecard__types">
        <div class="pokecard__type__title">Types</div>
        <app-pokecard-type element="grass"></app-pokecard-type>
        <app-pokecard-type element="poison"></app-pokecard-type>
    </div>
    <div class="pokecard__stats">
        <div class="pokecard__stat">
            <span class="pokecard__stat-name">HP</span>
            <span class="pokecard__stat-value">45</span>
        </div>
    </div>
    <app-pokecard-art></app-pokecard-art>
    <div class="pokecard__description">
        <p class="pokecard__description--text">For some time after its birth, it uses the nutrients that are packed into the seed on its back in order to grow.</p>
    </div>
    
</div>
