<div class="abilities__container">
  <div class="abilities__container--cost">
    <app-pokecard-type-holder [data]="data().cost"></app-pokecard-type-holder>
  </div>
  <div class="abilities__container--item">
    {{ data().name }} -
    <span class="abilities__container--item--description">{{ data().description }}</span>
  </div>
  <div class="abilities__container--damage">{{ data().damage }}</div>
</div>
